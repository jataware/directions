name: Directions Review Proposal
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: directions-review-proposal-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  propose:
    # Forks do not receive model secrets. The slash-command example is the explicit alternative.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read guidance from the trusted default branch, not PR executable code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jataware/directions/agent@REPLACE_WITH_FULL_COMMIT_SHA
        id: agent
        with:
          model: openai/gpt-6.1-sol
          api-key: ${{ secrets.OPENAI_API_KEY }}
          profile: review
          github-capabilities: read,review-propose
          task: |
            Read the pull request, general discussion, and relevant pinned source.
            Apply repository policies and retain a review proposal. Publication is
            unavailable. Summarize the proposal and evidence limitations in the final response.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.agent.outputs.artifact-directory != '' }}
        with:
          name: directions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.agent.outputs.artifact-directory }}
          retention-days: 3
