name: Directions PR Description Proposal
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  describe:
    if: github.event.issue.pull_request && github.event.comment.body == '/directions describe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read guidance from the trusted default branch, not PR executable code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jataware/directions/agent@REPLACE_WITH_FULL_COMMIT_SHA
        id: agent
        with:
          model: openai/gpt-6.1-sol
          api-key: ${{ secrets.OPENAI_API_KEY }}
          profile: describe
          github-capabilities: read
          task: |
            Inspect this pull request and relevant source and discussion. Return a
            complete proposed PR description as final Markdown, preserving known
            issue links and distinguishing executed validation from suggested tests.
            Do not publish or modify the current description. The maintainer will
            review response.md from the artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.agent.outputs.artifact-directory != '' }}
        with:
          name: directions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.agent.outputs.artifact-directory }}
          retention-days: 3
