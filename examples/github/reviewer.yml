name: Directions PR Review
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  pull-requests: write
concurrency:
  group: directions-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      (github.event.issue.pull_request || github.event_name == 'pull_request_review_comment') &&
      github.event.comment.body == '/directions review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read guidance from the trusted default branch, not PR executable code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jataware/directions/agent@REPLACE_WITH_FULL_COMMIT_SHA
        id: agent
        with:
          model: openai/gpt-6.1-sol
          api-key: ${{ secrets.OPENAI_API_KEY }}
          profile: review
          github-capabilities: read,review-propose,review-publish
          # COMMENT is the default enforced outcome. Opt into other outcomes deliberately.
          github-review-events: COMMENT
          task: |
            Review the bound pull request. Read its snapshot and general discussion,
            inspect relevant pinned source, and apply the selected repository policies.
            Explain any missing patches, uninspected files, or unavailable inline history.
            Propose a COMMENT review, then publish it using the publication tool.
            Do not claim tests were run or a complete review when evidence is missing.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.agent.outputs.artifact-directory != '' }}
        with:
          name: directions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.agent.outputs.artifact-directory }}
          retention-days: 3
