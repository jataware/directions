name: Directions Issue Plan
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: directions-issue-plan-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.body == '/directions plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read guidance from the trusted default branch, not PR executable code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jataware/directions/agent@REPLACE_WITH_FULL_COMMIT_SHA
        id: agent
        with:
          model: openai/gpt-6.1-sol
          api-key: ${{ secrets.OPENAI_API_KEY }}
          profile: plan
          github-capabilities: read,comment-propose,comment-publish
          task: |
            Read the bound issue, all relevant pages of general discussion, and pinned
            repository source. Produce a focused implementation plan with assumptions,
            affected files, and validation steps. Propose and publish the plan as a new
            issue comment. Do not edit the issue body, repository files, or claim implementation.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.agent.outputs.artifact-directory != '' }}
        with:
          name: directions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.agent.outputs.artifact-directory }}
          retention-days: 3
