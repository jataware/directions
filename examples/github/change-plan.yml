name: Directions Change Plan
on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: PR to inspect
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read guidance from the trusted default branch, not PR executable code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jataware/directions/agent@REPLACE_WITH_FULL_COMMIT_SHA
        id: agent
        with:
          model: openai/gpt-6.1-sol
          api-key: ${{ secrets.OPENAI_API_KEY }}
          profile: plan
          pull-request: ${{ inputs.pull-request }}
          github-capabilities: read
          task: |
            Inspect the bound PR, relevant pinned source, and general discussion.
            Produce a focused follow-up implementation plan, with suggested code
            snippets or a proposed diff where useful, plus validation steps.
            No code-editing, test execution, commit, push, or PR-creation tools are
            available. Return a proposal only; do not claim an applied change.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.agent.outputs.artifact-directory != '' }}
        with:
          name: directions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.agent.outputs.artifact-directory }}
          retention-days: 3
